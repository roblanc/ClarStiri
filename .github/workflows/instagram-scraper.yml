name: Instagram OCR Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Rulează zilnic la miezul nopții
  workflow_dispatch: # Permite rularea manuală din GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install instaloader google-generativeai upstash-redis python-dotenv

      - name: Create env file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          # Without these the scraper "succeeds" but only prints results instead of saving them.
          for v in GEMINI_API_KEY UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; exit 1; fi
          done
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env.local
          echo "UPSTASH_REDIS_REST_URL=$UPSTASH_REDIS_REST_URL" >> .env.local
          echo "UPSTASH_REDIS_REST_TOKEN=$UPSTASH_REDIS_REST_TOKEN" >> .env.local

      # Each profile keeps going if another one fails; the last step turns any
      # failure into a red workflow so it is not silently swallowed.
      - name: Scrape Dana Budeanu
        id: dana
        continue-on-error: true
        run: python scripts/scrapers/instagram_ocr.py danabudeanu --profile-id dana-budeanu --profile-name "Dana Budeanu"

      - name: Scrape Mircea Badea
        id: badea
        continue-on-error: true
        run: python scripts/scrapers/instagram_ocr.py mirceabadea --profile-id mircea-badea --profile-name "Mircea Badea"

      - name: Scrape Selly
        id: selly
        continue-on-error: true
        run: python scripts/scrapers/instagram_ocr.py selly --profile-id selly --profile-name "Selly"

      - name: Fail if any profile failed
        if: always()
        run: |
          failed=""
          [ "${{ steps.dana.outcome }}" = "success" ] || failed="$failed dana-budeanu"
          [ "${{ steps.badea.outcome }}" = "success" ] || failed="$failed mircea-badea"
          [ "${{ steps.selly.outcome }}" = "success" ] || failed="$failed selly"
          if [ -n "$failed" ]; then
            echo "::error::Instagram scrape failed for:$failed"
            exit 1
          fi
