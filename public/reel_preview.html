<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Reel Instagram - thesite.ro</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #121214;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #f4f4f5;
  }
  p {
    font-size: 14px;
    color: #a1a1aa;
    margin-bottom: 24px;
  }
  .phone-mockup {
    width: 360px;
    height: 640px;
    border-radius: 40px;
    border: 6px solid #27272a;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    background: #000;
    position: relative;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 12px;
  }
  button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover {
    background: #1d4ed8;
  }
</style>
</head>
<body>
  <h1>🎬 Previzualizare Reel Instagram (9:16)</h1>
  <p>Format video vertical 1080x1920, 60fps, optimizat pentru Instagram Reels & TikTok</p>
  
  <div class="phone-mockup">
    <video id="reelVideo" autoplay loop muted playsinline controls>
      <source src="/social_export/latest/reel.mp4" type="video/mp4">
      Browserul tău nu suportă redarea video.
    </video>
  </div>

  <div class="controls">
    <button onclick="document.getElementById('reelVideo').play()">▶️ Play</button>
    <button onclick="document.getElementById('reelVideo').pause()">⏸️ Pause</button>
  </div>
</body>
</html>
