<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previzualizare Instagram Reels UI - thesite.ro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090b;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 30px 20px;
  }
  .header-info {
    text-align: center;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #f4f4f5;
  }
  p {
    font-size: 14px;
    color: #a1a1aa;
  }

  /* Phone Mockup (Exact 9:16 aspect ratio) */
  .phone-frame {
    width: 390px;
    height: 693px; /* Exact 9:16 */
    background: #000;
    border-radius: 44px;
    border: 10px solid #27272a;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
  }

  /* Dynamic Island */
  .notch {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    z-index: 50;
  }

  /* Video Layer */
  .video-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Instagram Overlay Layer */
  .ig-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 40;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 54px 16px 24px 16px;
    background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, transparent 15%, transparent 70%, rgba(0,0,0,0.7) 100%);
  }

  /* Top Bar */
  .ig-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .ig-top-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 20px;
    font-weight: 700;
  }

  /* Right Action Column (Like, Comment, Share, Audio) */
  .ig-actions-col {
    position: absolute;
    right: 12px;
    bottom: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .ig-action-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .ig-action-icon {
    width: 28px;
    height: 28px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .ig-audio-disc {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 2px solid #fff;
    background: url('https://www.thesite.ro/hero-illustration-headphones.webp') center/cover;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    animation: rotateDisc 4s linear infinite;
  }
  @keyframes rotateDisc {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Bottom Left Info (Profile, Caption, Audio Tag) */
  .ig-bottom-info {
    max-width: 280px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  .ig-user-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ig-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid #fff;
    background: #fff url('https://www.thesite.ro/hero-illustration-headphones.webp') center/contain no-repeat;
  }
  .ig-username {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
  }
  .ig-follow-btn {
    border: 1px solid rgba(255,255,255,0.7);
    padding: 3px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    backdrop-filter: blur(4px);
  }
  .ig-caption {
    font-size: 13px;
    line-height: 1.4;
    color: #f4f4f5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .ig-caption b {
    color: #60a5fa;
  }
  .ig-audio-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #e4e4e7;
  }

  /* Controls */
  .controls-row {
    margin-top: 24px;
    display: flex;
    gap: 14px;
  }
  .btn {
    background: #27272a;
    color: #f4f4f5;
    border: 1px solid #3f3f46;
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover {
    background: #3f3f46;
  }
  .btn-primary {
    background: #2563eb;
    border-color: #2563eb;
    color: #fff;
  }
  .btn-primary:hover {
    background: #1d4ed8;
  }
</style>
</head>
<body>

  <div class="header-info">
    <h1>📱 Simulare Instagram Reels UI</h1>
    <p>Verificare vizuală: elementele video respectă safe-zone-ul interfeței Instagram</p>
  </div>

  <div class="phone-frame">
    <!-- iPhone Notch -->
    <div class="notch"></div>

    <!-- Video -->
    <video id="reelVideo" class="video-layer" autoplay loop muted playsinline>
      <source src="../social_export/latest/reel.mp4" type="video/mp4">
    </video>

    <!-- Instagram Reels Overlay -->
    <div id="igOverlay" class="ig-overlay">
      <!-- Top Bar -->
      <div class="ig-top-bar">
        <div class="ig-top-title">
          <span>Reels</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>

      <!-- Right Action Column -->
      <div class="ig-actions-col">
        <div class="ig-action-item">
          <svg class="ig-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span>4.8K</span>
        </div>
        <div class="ig-action-item">
          <svg class="ig-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>182</span>
        </div>
        <div class="ig-action-item">
          <svg class="ig-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          <span>Share</span>
        </div>
        <div class="ig-action-item">
          <svg class="ig-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </div>
        <div class="ig-action-item" style="margin-top: 6px;">
          <div class="ig-audio-disc"></div>
        </div>
      </div>

      <!-- Bottom User & Caption Info -->
      <div class="ig-bottom-info">
        <div class="ig-user-row">
          <div class="ig-avatar"></div>
          <span class="ig-username">thesite.ro</span>
          <div class="ig-follow-btn">Urmărește</div>
        </div>
        <div class="ig-caption">
          Același eveniment, 3 unghiuri diferite. Vezi bias-ul politic din presa română pe <b>thesite.ro</b> #stiri #actualitate
        </div>
        <div class="ig-audio-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <span>Sunet original • thesite.ro</span>
        </div>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <button class="btn btn-primary" onclick="toggleOverlay()">Comută Overlay Instagram On/Off</button>
    <button class="btn" onclick="const v = document.getElementById('reelVideo'); v.paused ? v.play() : v.pause();">Play / Pauză</button>
  </div>

  <script>
    function toggleOverlay() {
      const ov = document.getElementById('igOverlay');
      ov.style.display = (ov.style.display === 'none') ? 'flex' : 'none';
    }
  </script>
</body>
</html>
